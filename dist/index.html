<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Atlas — AI 影像灵感库</title><meta name="description" content="探索 AI 图像与视频作品，查看作者与提示词。"><link rel="stylesheet" href="heroui.css"><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#">Visual Atlas<span>↗</span></a><nav><a href="#collection">探索作品</a><a id="repo" hidden target="_blank" rel="noopener">GitHub ↗</a></nav></header>
<main><section class="hero"><h1>下一次创作，<br><span>从这里开始。</span></h1><p>发现 AI 图像与视频的更多可能。</p></section>
