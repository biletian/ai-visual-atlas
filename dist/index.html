<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Atlas — AI 影像灵感库</title><meta name="description" content="探索 AI 图像与视频作品，查看作者与提示词。"><link rel="stylesheet" href="heroui.css"><link rel="stylesheet" href="style.css?v=20261113g"></head>
<body>
<aside class="sidebar">
<a class="brand" href="#" aria-label="Atlas 首页"><span class="brand-mark" data-icon="layers"></span><span>ATLAS</span></a>
<nav class="types" aria-label="作品分类"><h2>探索</h2><button class="selected" data-type="all"><i data-icon="layout-grid"></i><span class="nav-label">全部作品</span><span class="nav-count" id="totalCount"></span></button><button data-type="image"><i data-icon="image"></i><span class="nav-label">图像与动图</span></button><button data-type="video"><i data-icon="film"></i><span class="nav-label">视频</span></button><button data-type="saved"><i data-icon="bookmark"></i><span class="nav-label">我的收藏</span><span class="nav-count" id="savedCount">0</span></button></nav>
<section class="side-section"><h2>模型</h2><div id="modelLinks"></div></section><section class="side-section topics"><h2>创作主题</h2><div id="categoryLinks"></div></section>
<div class="side-bottom"><a id="repo" hidden target="_blank" rel="noopener"><i data-icon="book-open"></i><span>开源项目</span><i data-icon="arrow-up-right"></i></a><button id="aboutButton"><i data-icon="info"></i><span>关于与来源</span></button></div></aside>
<div class="page"><header class="topbar"><label class="search"><i data-icon="search"></i><input id="search" placeholder="搜索作品、风格、提示词" aria-label="搜索案例"><kbd aria-hidden="true">⌘ K</kbd></label><button class="saved-shortcut" id="savedShortcut" aria-label="查看收藏"><i data-icon="bookmark"></i><span>收藏</span></button></header>
<main id="collection"><div class="collection-heading"><div><h1>发现值得收藏的创作</h1></div><span id="count" aria-live="polite"></span></div>

<dialog id="detail"><button class="close" aria-label="关闭详情"><i data-icon="x"></i></button><div id="detailBody"></div></dialog><div role="status" id="toast"></div><script src="data.js?v=20261113g"></script><script src="ui.js?v=20261113g"></script><script src="app.js?v=20261113g"></script></body></html>
